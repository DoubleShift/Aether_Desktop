<!doctype html>
<html lang="zh-CN" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aether</title>
  <!-- chat.css also carries the shared .chat__modal styles used by the
       custom-config dialogs, so it stays even though the AI chat is gone. -->
  <!-- Light (white background) overlay. Loaded last so it wins over the
       upstream dark palette; generated by scripts/gen-light-theme.mjs. -->
  <script type="module" crossorigin src="/assets/index-paie3qmo.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Dsmg5ZAU.css">
</head>
<body>
  <!-- ۱.۴.۰-mobile: نوار ۲۸ پیکسلی ویندوز — فقط درگ، کمینه و بستن (decorations:false).
       بیشینه‌سازی عمداً وجود ندارد؛ پنجره یک قاب موبایلی ۳۹۰×۸۲۰ است. -->
  <header class="winbar" data-tauri-drag-region>
    <span class="winbar__spacer" data-tauri-drag-region></span>
    <button class="twin twin--min" type="button" aria-label="最小化"></button>
    <button class="twin twin--close" type="button" aria-label="关闭"></button>
  </header>

  <!-- هدر موبایل — پورت TopAppBar نسخهٔ اندروید -->
  <header class="mobile-header" id="mobile-header">
    <button class="mobile-header__btn mobile-header__menu" id="menu-btn" type="button" aria-label="菜单" aria-controls="drawer" aria-expanded="false"></button>
    <button class="mobile-header__btn mobile-header__back" id="back-btn" type="button" aria-label="返回" hidden></button>
    <div class="mobile-header__brand">
      <span class="mobile-header__title" id="header-title">Aether</span>
      <span class="mobile-header__tagline" id="header-tagline">一键连接，自由上网</span>
    </div>
    <span class="mobile-header__spacer"></span>
    <!-- The tunnel-settings shortcut was removed from the header in this build;
         the same rows remain reachable from 设置 (抽屉 → 设置 → Tunnel). -->
  </header>

  <!-- کشوی ناوبری رویی — همان Drawer موبایل -->
  <div class="drawer__backdrop" id="drawer-backdrop" hidden></div>
  <nav class="drawer" id="drawer" aria-label="导航" aria-hidden="true">
    <div class="drawer__head">
      <div class="drawer__brand">
        <span class="drawer__title">Aether</span>
        <span class="drawer__tagline">一键连接，自由上网</span>
      </div>
    </div>
    <div class="drawer__group" data-group="app">
      <button class="drawer__item" type="button" data-tab="advanced">设置</button>
      <button class="drawer__item" type="button" data-tab="diagnostics">诊断</button>
      <button class="drawer__item" type="button" data-tab="share">局域网共享</button>
      <button class="drawer__item" type="button" data-tab="about">关于</button>
    </div>
  </nav>

  <div class="shell">
    <main class="main" id="main">
      <div id="view"><div class="boot-skeleton" role="status" aria-busy="true">Aether · 正在启动…</div></div>
    </main>
  </div>

</body>
</html>
